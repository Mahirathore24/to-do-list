services:
  - type: web
    name: todo-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: my-backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        value: mongodb://localhost:27017/todolist
      - key: NODE_ENV
        value: production
    autoDeploy: true
